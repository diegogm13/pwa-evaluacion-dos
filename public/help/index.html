<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Ayuda</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#3f51b5">
    <link rel="apple-touch-icon" href="/src/images/icons/apple-icon-180x180.png" sizes="180x180">
    <link rel="stylesheet" href="/src/css/material.indigo-pink.min.css">
    <link rel="stylesheet" href="/src/css/material-icons.css">
<link rel="stylesheet" href="../src/css/help.css">

</head>

<body>

    <div id="app">
        <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">
            <header class="mdl-layout__header">
                <div class="mdl-layout__header-row">
                    <!-- Title -->
                    <span class="mdl-layout-title">UTEQGram</span>
                    <!-- Add spacer, to align navigation to the right -->
                    <div class="mdl-layout-spacer"></div>
                    <!-- Navigation. We hide it in small screens. -->
                    <nav class="mdl-navigation mdl-layout--large-screen-only">
                        <a class="mdl-navigation__link" href="/">Feed</a>
                        <a class="mdl-navigation__link" href="/help/index.html">Help</a>
                        <div class="drawer-option">
                            <button
                                class="enable-notifications mdl-button mdl-js-button mdl-button--raised mdl-button--colored mdl-color--accent">
                                Habilitar Notificaciones
                            </button>
                        </div>
                    </nav>
                </div>
            </header>
            <div class="mdl-layout__drawer">
                <span class="mdl-layout-title">UTEQGram</span>
                <nav class="mdl-navigation">
                    <a class="mdl-navigation__link" href="/">Feed</a>
                    <a class="mdl-navigation__link" href="/help/index.html">Help</a>
                    <div class="drawer-option">
                        <button
                            class="enable-notifications mdl-button mdl-js-button mdl-button--raised mdl-button--colored mdl-color--accent">
                            Habilitar Notificaciones
                        </button>
                    </div>
                </nav>
            </div>
            <main class="mdl-layout__content mat-typography">
                <div class="mdl-grid">
                    <div class="mdl-cell mdl-cell--12-col text-center">
                        <h3>Necesitas Ayuda?</h3>
                        <p>Aprende cómo usar esta app y comparte tus memorias increíbles con todos tus amigos!</p>
                    </div>
                </div>
                <div class="mdl-grid">
                    <div class="mdl-cell mdl-cell--12-col text-center">
                        <h3>Contactanos!</h3>
                        <div>
                            <button class="mdl-button mdl-js-button mdl-button--fab mdl-button--colored">
                                <i class="material-icons">call</i>
                            </button>
                            <button class="mdl-button mdl-js-button mdl-button--fab mdl-button--colored">
                                <i class="material-icons">email</i>
                            </button>
                            <button class="mdl-button mdl-js-button mdl-button--fab mdl-button--colored">
                                <i class="material-icons">chat_bubble</i>
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script defer src="/src/js/material.min.js"></script>
    <script src="/src/js/app.js"></script>
</body>

</html>
